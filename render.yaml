databases:
  - name: endurance-staging-db
    plan: free
    region: singapore
    databaseName: endurance
    user: endurance

services:
  - type: web
    name: endurance-staging-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_production
      - key: DATABASE_URL
        fromDatabase:
          name: endurance-staging-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        value: endurance-staging-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://endurance-staging-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://endurance-staging-web.onrender.com
      - key: JWT_REFRESH_COOKIE_SAMESITE
        value: None
      - key: FRONTEND_URL
        value: https://endurance-staging-web.onrender.com
      - key: DEFAULT_FROM_EMAIL
        value: noreply@endurance-staging.invalid
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: GARMIN_TRAINING_API_ENABLED
        value: "false"
      - key: GARMIN_PARTNER_STATUS
        value: application_required
      - key: STRAVA_INTEGRATION_ENABLED
        value: "false"
      - key: STRAVA_PARTNER_STATUS
        value: configuration_required
      - key: STRAVA_WEBHOOK_PROCESSING_ENABLED
        value: "false"
      - key: SUUNTO_PARTNER_STATUS
        value: application_required
      - key: COROS_PARTNER_STATUS
        value: application_required

  - type: web
    name: endurance-staging-web
    runtime: static
    autoDeployTrigger: checksPass
    buildCommand: cd frontend && npx --yes pnpm@11.9.0 install --frozen-lockfile && npx --yes pnpm@11.9.0 build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://endurance-staging-api.onrender.com/api/v1
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://endurance-staging-api.onrender.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
