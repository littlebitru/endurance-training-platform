databases:
  - name: endurance-staging-db
    plan: free
    region: singapore
    databaseName: endurance
    user: endurance

services:
  - type: web
    name: endurance-staging-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    autoDeployTrigger: checksPass
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_production
      - key: DATABASE_URL
        fromDatabase:
          name: endurance-staging-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        value: endurance-staging-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://endurance-staging-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://endurance-staging-web.onrender.com
      - key: FRONTEND_URL
        value: https://endurance-staging-web.onrender.com
      - key: DEFAULT_FROM_EMAIL
        value: noreply@endurance-staging.invalid
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend

  - type: web
    name: endurance-staging-web
    runtime: static
    autoDeployTrigger: checksPass
    buildCommand: cd frontend && npm install --no-audit --no-fund && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://endurance-staging-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
